name: qontinui CI
# DO NOT DELETE THE `push:` TRIGGER, and do not narrow it past the branch list
# below. coord's merge train pushes `merge-candidate/<uuid>` and waits
# `awaiting-ci` for check-runs on that ref. A `pull_request`-only workflow can
# never satisfy it: the train times out at COORD_MERGE_CI_TIMEOUT (1800s),
# requeues forever, and permanently consumes one of COORD_MERGE_SLOTS
# (default 3). coord also judges "can this repo produce candidate CI?" purely on
# the PRESENCE of this `push:` key (`ci_baseline.rs`
# `is_candidate_check_producing_trigger` is branch-filter-blind by design), so
# deleting it trips AlertKind::MergeCandidateNoCiProducer.
#
# The three `merge-candidate*` prefixes are coord's authoritative list
# (`ci_observer.rs` CANDIDATE_BRANCH_PREFIXES_EXACT). Omitting one wedges the
# train. `master` must stay too: coord's head-baseline axis needs a `push`
# trigger that CAN fire on the default branch.
#
# WHY THIS IS SCOPED RATHER THAN THE `on: [push, pull_request]` IT REPLACED.
# An UNFILTERED `push:` also fired on every PR head branch, so every PR ran this
# workflow TWICE against the same head SHA - two runs of identical work
# competing for the same hosted-runner pool, and the PR pinned at
# mergeStateStatus=UNSTABLE until the slower duplicate drained. A `concurrency:`
# block does NOT fix it: `github.ref` differs by event (`refs/heads/<branch>` vs
# `refs/pull/<n>/merge`) so the two runs land in different groups - measured,
# qontinui-docs and qontinui-gym carry `cancel-in-progress: true` and still emit
# both runs at one SHA. Plan:
# 2026-08-31-devops-unfiltered-push-trigger-duplicates-every-pr-ci-run.
#
# `pull_request:` is deliberately left UNFILTERED so stacked PRs based on a
# long-lived integration branch still get CI.
on:
  push:
    branches:
      - master
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  pull_request:

# Least-privilege, stated explicitly rather than inherited from the repo-level
# `default_workflow_permissions`. This job only reads the tree and runs npm; it
# never writes back. publish.yml states its own (wider, OIDC-shaped) grant the
# same way rather than inheriting.
permissions:
  contents: read

# NOTE ON THE ABSENT `Lint` STEP. This file used to carry
# `run: npm run lint --if-present`, which was a guaranteed no-op: package.json
# declares no `lint` script and the repo has no ESLint config, so the step
# exited 0 without linting anything while reporting a green "Lint" in every
# run. Sibling package qontinui-workflow-ui states the same convention in its
# own CI - invoke only the scripts that exist. Re-add this step in the SAME
# change that adds the `lint` script and its config, never before.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5 on both, matching publish.yml and the deliberate v4 -> v5 bump in
      # ae4dc15. The retired coord onboarding template that seeded this file
      # (44b93f8) pinned v4 and silently reverted that bump for this workflow.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # Bare `npm ci` - NOT the `npm ci || npm install` this replaces. That
      # fallback swallowed the one failure the step exists to catch: a
      # package-lock.json out of sync with package.json. publish.yml runs bare
      # `npm ci`, so the fallback let CI go green on a lockfile that the release
      # would then reject at publish time - the exact break repaired by b5bbab6,
      # 7d11619 and c80549c. `.qontinui/config.yml` already lists both manifest
      # paths under `escalate_paths`; CI should verify them, not paper over them.
      - name: Install dependencies
        run: npm ci
      # `npm run typecheck`, not `npx --yes tsc --noEmit`. The package declares
      # a `typecheck` script that nothing invoked. `npx --yes` will silently
      # DOWNLOAD a TypeScript from the registry rather than fail, typechecking
      # against a compiler other than the pinned `typescript` devDependency. The
      # `if [ -f tsconfig.json ]` guard it replaces was both dead (the file is
      # committed) and fail-open (a rename would have passed silently).
      - name: Type check
        run: npm run typecheck
      # `--if-present` dropped from build and test: both scripts exist, and the
      # flag turned deleting either one into a silent green instead of a failure.
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
